pid /var/snap/games/current/nginx.pid;
daemon off;
worker_processes auto;

error_log syslog:server=unix:/dev/log warn;

events {
    worker_connections 1024;
}

http {
    access_log syslog:server=unix:/dev/log;
    include /snap/games/current/nginx/etc/nginx/mime.types;

    client_body_temp_path /var/snap/games/current/nginx/client_body_temp;
    proxy_temp_path /var/snap/games/current/nginx/proxy_temp;
    fastcgi_temp_path /var/snap/games/current/nginx/fastcgi_temp;
    uwsgi_temp_path /var/snap/games/current/nginx/uwsgi_temp;
    scgi_temp_path /var/snap/games/current/nginx/scgi_temp;

    upstream backend {
        server unix:/var/snap/games/current/backend.sock;
    }

    server {
        listen unix:/var/snap/games/common/web.socket;

        set_real_ip_from unix:;
        server_name localhost;

        root /snap/games/current/web/dist;

        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css application/json application/javascript text/javascript;

        # SPA static assets — public. The SPA fetches /api/v1/me on load
        # and redirects to /auth/login if 401.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # OIDC handshake endpoints — proxied to backend (no auth check;
        # backend's /auth/login does the redirect to Authelia).
        location /auth/ {
            include /var/snap/games/current/config/proxy.conf;
            proxy_pass http://backend;
        }

        # API — backend auth middleware enforces login (signed session cookie
        # or HTTP Basic Auth delegated to Authelia for tests/curl users).
        location /api/ {
            include /var/snap/games/current/config/proxy.conf;
            proxy_pass http://backend;
        }
    }
}
